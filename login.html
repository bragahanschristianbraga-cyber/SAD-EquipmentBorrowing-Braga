<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Login — Equipment Borrowing System</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body class="auth-body">

  <div class="auth-card">
    <h1>Equipment Borrowing<br>Monitoring System</h1>
    <p class="subtitle">Sign in to manage equipment and borrowing records</p>

    <form id="login-form" onsubmit="handleLogin(event)">
      <label for="email">Email</label>
      <input type="email" id="email" placeholder="you@college.edu" required />

      <label for="password">Password</label>
      <input type="password" id="password" placeholder="••••••••" required />

      <p id="login-error" class="error-text"></p>

      <button type="submit" id="login-btn" class="btn btn-primary btn-block">Login</button>
    </form>

    <p class="hint">Only authenticated System Users / Equipment Custodians may access this system.</p>
  </div>

  <div id="toast-container" class="toast-container"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/auth.js"></script>
  <script>
    redirectIfLoggedIn();
  </script>
</body>
</html>
